port: 11570

seeds:
  use_seeds: True
  id: 42

data:
  dataset: AirLab

  data_path:
    car: null
    drone: null
    dog: /home/furo-inc/fuk_ws/unitree_rl_mjlab_test/furo_rl_locomotion_mjlab/locomotion_dataset/dataset/collection_locomotion_oshima_19500/tartan_imu
    human: null

  use_local_coord: True

  train_dir: train
  validation_dir: val
  test_dir: test

  random_partition: False
  data_rate: 1.0
  train_rate: 0.7
  valid_rate: 0.15
  test_rate: 0.15

  imu_freq: 200.0
  sample_freq: 40
  # Causal endpoint target: history [t_k-H, ..., t_k] -> v_B(t_k).
  velocity_target: current

  gravity_alignment:
    enabled: False
    magnitude: 9.8101
    direction: [0, 0, -1]
    enable_validation: False
    visualize: False

augment:
  feat_acc_sigma: 0.0001
  feat_gyr_sigma: 0.00001

  add_bias_noise: True
  accel_bias_range: 0.1
  gyro_bias_range: 0.002

  add_gravity_noise: True
  gravity_noise_theta_range: 5

model:
  model_name: Foundation_Model
  model_yaml: "./config/resnet_lstm_multihead.yaml"
  pred_velocity: True
  adapter: False

train:
  experiment_name: go2_tartanimu_finetune_v2

  out_dir: ./exp_result/go2_tartanimu_finetune_v2

  use_pretrain_model: True
  # expert_dog.pt is preferred when available; passed via --resume_from.
  pretrained_source: expert_dog.pt
  dog_head_init: pretrained  # set reinitialize to compare a fresh velocity head
  freeze_backbone: true      # Phase 1; set false for Phase 2
  use_multi_gpu: False
  use_amp: True

  batch_size: 512
  epochs: 30

  # 今回はcovarianceを目的にしない
  start_cov_epochs: 9999

  n_workers: 4
  seq_len: 10

  predict_start: 0
  predict_end: 10
  add_noise: True

  # Go2なのでdog headのみ
  active_heads:
    - dog

  optimizer:
    learning_rate: 0.0001 # 0.00001
    backbone_learning_rate: 0.00001
    head_learning_rate: 0.0001
    method: Adam
    weight_decay: 0.01

  scheduler:
    factor: 0.1
    patience: 8

val:
  batch_size: 512
  n_workers: 2

test:
  out_dir: ./exp_result/go2_tartanimu_finetune_v2
  n_workers: 2

schemes:
  train: True
  test: False
  online_adaption: False
