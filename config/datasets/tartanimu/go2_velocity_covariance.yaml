# Go2 causal current body-frame velocity plus full 3x3 body covariance.
port: 11570
seeds: {use_seeds: True, id: 42}
data:
  dataset: AirLab
  data_path: {car: null, drone: null, dog: /home/furo-inc/fuk_ws/unitree_rl_mjlab_test/furo_rl_locomotion_mjlab/locomotion_dataset/dataset/collection_locomotion_oshima_39700/tartan_imu, human: null}
  use_local_coord: True
  train_dir: train
  validation_dir: val
  test_dir: test
  random_partition: False
  data_rate: 1.0
  train_rate: 0.7
  valid_rate: 0.15
  test_rate: 0.15
  imu_freq: 200.0
  sample_freq: 40
  velocity_target: current
  current_velocity_max_speed: 10.0
  gravity_alignment: {enabled: False, magnitude: 9.8101, direction: [0, 0, -1], enable_validation: False, visualize: False}
augment:
  feat_acc_sigma: 0.0001
  feat_gyr_sigma: 0.00001
  add_bias_noise: True
  accel_bias_range: 0.1
  gyro_bias_range: 0.002
  add_gravity_noise: True
  gravity_noise_theta_range: 5
model:
  model_name: Foundation_Model
  model_yaml: "./config/resnet_lstm_multihead.yaml"
  pred_velocity: True
  adapter: False
  velocity_covariance:
    enabled: true
    parameterization: softplus_cholesky
    raw_dim: 6
    eps: 1.0e-4
    initial_std: 0.1
train:
  experiment_name: go2_velocity_covariance
  out_dir: ./exp_result/go2_velocity_covariance
  use_pretrain_model: False
  pretrained_source: current_velocity_checkpoint.pt
  dog_head_init: pretrained
  freeze_backbone: False
  use_multi_gpu: False
  use_amp: True
  batch_size: 512
  epochs: 30
  # Full covariance is active from the first epoch; legacy output_block2 remains unused.
  start_cov_epochs: 0
  n_workers: 4
  seq_len: 10
  predict_start: 0
  predict_end: 10
  add_noise: True
  velocity_loss:
    speed_weighting: {enabled: true, alpha: 2.0, v_ref: 0.25, power: 2.0, normalize_mean: true}
  covariance:
    enabled: true
    loss_weight: 1.0
    detach_velocity_for_covariance_loss: true
    apply_speed_weighting: false
    freeze_backbone: true
    freeze_velocity_head: true
    head_learning_rate: 1.0e-4
  active_heads: [dog]
  optimizer: {learning_rate: 0.0001, backbone_learning_rate: 0.00001, head_learning_rate: 0.0001, method: Adam, weight_decay: 0.01}
  scheduler: {factor: 0.1, patience: 8}
val: {batch_size: 512, n_workers: 2}
test: {out_dir: ./exp_result/go2_velocity_covariance, n_workers: 2}
schemes: {train: True, online_adaption: False, offline_finetune: False, test: False}
